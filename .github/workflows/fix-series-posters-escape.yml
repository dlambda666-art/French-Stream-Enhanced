name: Fix series poster patch escaping
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated JavaScript
        run: |
          perl -0pi -e 's/\\\\n/\n/g; s/\\\\\\\\s\+/\\\\s+/g' addon.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js .github/workflows/fix-series-posters-escape.yml
          git commit -m "fix: correct series poster JavaScript"
          git rm .github/workflows/fix-series-posters-escape.yml
          git commit -m "chore: remove temporary escape repair workflow"
          git push
