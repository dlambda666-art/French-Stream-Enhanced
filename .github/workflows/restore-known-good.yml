name: Restore known-good state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 2026-09-15 known-good tree
        run: |
          set -e
          TARGET=737391abf9dec668618c7ea3bcf6e40d99d86b96
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u "$TARGET"
          git clean -fd
          git add -A
          git commit -m "revert: restore known-good 2026-09-15 state"
          git push origin HEAD:main
