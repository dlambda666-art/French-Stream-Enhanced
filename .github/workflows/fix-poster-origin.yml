name: Repair poster origin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix addon poster origin
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          old = "            poster = FRENCH_STREAM_ORIGIN + (poster.startsWith('/') ? poster : '/' + poster);"
          new = "            poster = 'https://maj.french-stream.pink' + (poster.startsWith('/') ? poster : '/' + poster);"
          if old not in s:
              raise SystemExit('Expected addon origin line not found')
          p.write_text(s.replace(old, new, 1))
          print('Addon poster origin fixed')
          PY
          grep -q "https://maj.french-stream.pink' + (poster.startsWith" addon.js
          grep -q "module.exports" addon.js
          node --check addon.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          git rm .github/workflows/fix-poster-origin.yml
          git commit -m "fix: use addon poster origin"
          git push
