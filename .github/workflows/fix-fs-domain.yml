name: Fix French Stream domain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old French Stream domain
        run: |
          set -e
          sed -i 's#https://french-stream\.pink#https://maj.french-stream.pink#g' addon.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addon.js .github/workflows/fix-fs-domain.yml
          git rm -f .github/workflows/fix-fs-domain.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: switch French Stream source to maj domain'
          git push
