name: Finalize series poster JavaScript repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal escapes
        run: |
          perl -0pi -e 's/\\n/\n/g; s/\\\\s\+/\\s+/g' addon.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize series poster extraction"
          git push
