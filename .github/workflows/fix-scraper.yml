name: Fix French Stream scraper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace brittle catalog scrapers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          addon = Path('addon.js')
          text = addon.read_text()
          replacement = r'''async function scrapeItems(html, type) {
              const $ = cheerio.load(html);
              const items = [];
              const seen = new Set();
              const links = $('a[href*="newsid="]');

              links.each((i, link) => {
                  const $link = $(link);
                  const href = $link.attr('href');
                  if (!href || seen.has(href)) return;

                  const $card = $link.closest('.short-in, .movie-item, .short, article.short, .th-item, article, li, .item');
                  const $scope = $card.length ? $card : $link.parent();
                  let title = $scope.find('.short-title, .th-title, h3, h4, .title').first().text().trim();
                  if (!title) title = $link.attr('title') || $link.find('img').attr('alt') || $link.text().trim();
                  if (!title) return;

                  let poster = $scope.find('img').first().attr('src') || $scope.find('img').first().attr('data-src') || $link.find('img').attr('src') || '';
                  if (poster && !poster.startsWith('http')) poster = 'https://maj.french-stream.pink' + poster;

                  const text = $scope.text().replace(/\\s+/g, ' ').trim();
                  const languageText = text.match(/VF(?:\\+VOSTFR)?|VOSTFR/)?.[0] || '';
                  const languageTag = languageText === 'VOSTFR' ? 'VOSTFR' : languageText.includes('VF') ? 'VF' : '';
                  const isVostfrOnly = languageText === 'VOSTFR';

                  seen.add(href);
                  items.push({ title, poster, href, type, languageText, languageTag, isVostfrOnly });
              });

              return items;
          }'''
          pattern = r'async function scrapeItems\(html, type\) \{.*?(?=\nasync function |\nfunction |\nconst |\nmodule\.exports|$)'
          new, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('addon.js scrapeItems function not found')
          addon.write_text(new)

          worker = Path('src/worker.mjs')
          if worker.exists():
              text = worker.read_text()
              replacement_worker = replacement.replace('async function scrapeItems(html, type)', 'function scrapeItems(htmlBody, type)').replace('cheerio.load(html)', 'cheerio.load(htmlBody)').replace("'https://maj.french-stream.pink' + poster", "FRENCH_STREAM_ORIGIN + poster")
              pattern_worker = r'function scrapeItems\(htmlBody, type\) \{.*?(?=\n(?:async )?function |\nconst |\nexport |$)'
              new, n = re.subn(pattern_worker, replacement_worker, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('worker scrapeItems function not found')
              worker.write_text(new)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addon.js src/worker.mjs
          git diff --cached --quiet && { git rm -f .github/workflows/fix-scraper.yml; exit 0; }
          git commit -m 'fix: make catalog scraping resilient to markup changes'
          git push
          git rm -f .github/workflows/fix-scraper.yml
          git commit -m 'chore: remove one-shot scraper fix workflow'
          git push
