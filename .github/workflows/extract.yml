name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found. Nothing to do."
            exit 0
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted
          find extracted -type d -name ".github" -prune -exec rm -rf {} +

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted "$ZIP"

      - name: Fix lazy-loaded poster extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          old = "        let poster = $img.attr('src') || $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || '';"
          new = "        // French Stream uses lazy-loading on some posters: prefer the real lazy source over a placeholder src.\n        let poster = $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || $img.attr('src') || '';"
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Lazy poster extraction fixed.')
          else:
              print('Lazy poster extraction already fixed or source line changed; no patch needed.')
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix: support lazy-loaded poster sources"
            git push
          fi
