name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No ZIP file found. Nothing to do."; exit 0; fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          find extracted -type d -name ".github" -prune -exec rm -rf {} +
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then cp -a "$ROOT"/. .; else cp -a extracted/. .; fi
          rm -rf extracted "$ZIP"
      - name: Verify TMDB poster responses
        shell: python
        run: |
          import urllib.request
          paths = {
            'violent':'nTOcuBNhCoCTlGjWJtPoOu6OlaR.jpg',
            'noel':'bItJW60f2JZ0otXxK1rKG5aW8Ky.jpg',
            'winnie2':'s8oLTxEwlv3AMDEDlE7q2LyWhjO.jpg',
            'wake':'kNcUH0rfdBKTBCvdFxGvuBInU4O.jpg',
            'maxxxine':'uagihpF2YcMBqCEZVcWtACqJS4w.jpg',
            'intrus':'8tTf9k67NN737FaHnK7YqFpLzBX.jpg',
            'thanksgiving':'rH9uuXHAHsm6NdVzZPlhSReguLa.jpg'
          }
          for name, path in paths.items():
            for size in ('w300','w500'):
              url=f'https://image.tmdb.org/t/p/{size}/{path}'
              try:
                req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                r=urllib.request.urlopen(req, timeout=20)
                body=r.read()
                print(name, size, r.status, r.headers.get('Content-Type'), len(body))
              except Exception as e:
                print(name, size, 'ERROR', repr(e))
      - name: Enforce direct poster architecture
        shell: python
        run: |
          from pathlib import Path
          replacements=[
            (Path('addon.js'),"poster = betterPosterUrl(tmdb.imdbId, item.languageTag, config.posterBaseUrl) || tmdb.poster || poster;","poster = tmdb.poster || poster;"),
            (Path('src/worker.mjs'),"const poster = betterPosterUrl(tmdb.imdbId, item.languageTag, config.posterBaseUrl) || tmdb.poster || item.poster;","const poster = tmdb.poster || item.poster;")
          ]
          for path,old,new in replacements:
            if not path.exists(): raise SystemExit(f'Missing required file: {path}')
            text=path.read_text()
            if old in text: path.write_text(text.replace(old,new)); print(f'Poster override removed from {path}')
            elif new in text: print(f'{path} already uses direct posters')
            else: raise SystemExit(f'Expected poster selection not found in {path}')
      - name: Verify poster architecture
        run: |
          grep -n "poster = tmdb.poster || poster" addon.js
          grep -n "const poster = tmdb.poster || item.poster" src/worker.mjs
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; else git commit -m "Extract French Stream project"; git push; fi
