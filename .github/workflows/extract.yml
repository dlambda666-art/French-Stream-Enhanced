name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found. Nothing to do."
            exit 0
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted "$ZIP"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Extract French Stream project"
            git push
          fi
