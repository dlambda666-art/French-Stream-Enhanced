      - name: Repair BetterPoster and lazy-loaded series posters
        run: python3 -c 'import base64;exec(base64.b64decode("   c2V0ID0gJGltZy5hdHRyKCdzcmNzZXQnKSB8fCAkJGltZy5hdHRyKCdkYXRhLXNyY3NldCcpIHx8ICcnO1xuICAgICAgICAgICAgcG9zdGVyID0gc3Jj c2V0LnNwbGl0KCcsJylbMF0/LnRyaW0oKS5zcGxpdCgvXFxcXHMrLylbMF0gfHwgJyc7XG4gICAgICAgIH1cbiAgICAgICAgaWYgKHBvc3RlciAmJiAhcG9zdGVyLnN0YXJ0c1dpdGgoJ2h0dHAnKSkgcG9zdGVyID0gJ2h0dHBzOi8vbWFqLmZyZW5jaC1zdHJlYW0ucGluaycgKyBwb3N0ZXI7IiIiCm5ld19wb3N0ZXIgPSAiIiJcICAgICAgICBjb25zdCAkaW1nID0gJChlbCkuZmluZCgnaW1nJyk uZmlyc3QoKTsKICAgICAgICAvLyBNYW55IHNlcmllcyBwb3N0ZXJzIGFyZSBsYXp5LWxvYWRlZDogc3JjIG1heSBiZSBhIGJsYW5rL3BsYWNlaG9sZGVyIHdoaWxlIHRoZSByZWFsIFVSTCBpcyBpbiBkYXRhLSogb3Igc3Jj ')," )' 

      - name: Validate JavaScript
        run: node --check addon.js

      - name: Commit repaired addon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          if git diff --cached --quiet; then echo "Nothing to commit."; else git commit -m "fix: restore BetterPoster and prefer real lazy-loaded series posters"; git push; fi
