name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found. Nothing to do."
          else
            mkdir extracted
            unzip -q "$ZIP" -d extracted
            find extracted -type d -name ".github" -prune -exec rm -rf {} +

            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              cp -a "$ROOT"/. .
            else
              cp -a extracted/. .
            fi

            rm -rf extracted "$ZIP"
          fi

      - name: Repair BetterPoster and lazy-loaded series posters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text(encoding='utf-8')

          old_bp = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // No BetterPoster at all. Tagged items still use our French Poster SVG pipeline.
              if (!languageTag || languageTag === 'NONE') return null;
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return null;
              return `${root}/poster/${safeId}/${languageTag.toLowerCase()}.svg`;
          }"""
          new_bp = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // Restore BetterPoster for untagged items. Tagged items keep the French Poster badge pipeline.
              if (!languageTag || languageTag === 'NONE') return `${BETTERPOSTER_BASE}${safeId}.jpg`;
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return `${BETTERPOSTER_BASE}${safeId}.jpg`;
              return `${root}/poster/${safeId}/${languageTag.toLowerCase()}.svg`;
          }"""
          if old_bp not in s:
              raise SystemExit('BetterPoster block not found; refusing a blind edit.')
          s = s.replace(old_bp, new_bp, 1)

          old_poster = """        const $img = $(el).find('img').first();
        let poster = $img.attr('src') || $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || '';
        if (!poster) {
            const srcset = $img.attr('srcset') || $img.attr('data-srcset') || '';
            poster = srcset.split(',')[0]?.trim().split(/\\s+/)[0] || '';
        }
        if (poster && !poster.startsWith('http')) poster = 'https://maj.french-stream.pink' + poster;"""
          new_poster = """        const $img = $(el).find('img').first();
        // Many series posters are lazy-loaded: src may be a blank/placeholder while the real URL is in data-* or srcset.
        const posterCandidates = [
            $img.attr('data-src'),
            $img.attr('data-original'),
            $img.attr('data-lazy-src'),
            $img.attr('data-url'),
            $img.attr('data-poster'),
            $img.attr('data-image'),
            $img.attr('data-srcset'),
            $img.attr('srcset'),
            $img.attr('src')
        ].filter(Boolean);
        let poster = '';
        for (const candidate of posterCandidates) {
            const first = String(candidate).split(',')[0]?.trim().split(/\\s+/)[0] || '';
            if (!first || /^(data:image|about:blank)/i.test(first)) continue;
            if (/(?:^|[\\/_-])(blank|placeholder|spacer|transparent)(?:[._/-]|$)/i.test(first)) continue;
            poster = first;
            break;
        }
        if (poster.startsWith('//')) poster = 'https:' + poster;
        else if (poster && !/^https?:\\/\\//i.test(poster)) poster = 'https://maj.french-stream.pink' + (poster.startsWith('/') ? '' : '/') + poster;"""
          if old_poster not in s:
              raise SystemExit('Poster extraction block not found; refusing a blind edit.')
          s = s.replace(old_poster, new_poster, 1)

          p.write_text(s, encoding='utf-8')
          print('Deterministic poster repair applied.')
          PY

      - name: Validate JavaScript
        run: node --check addon.js

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix: restore BetterPoster and prefer real lazy-loaded series posters"
            git push
          fi
