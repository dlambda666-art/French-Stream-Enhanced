name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No ZIP file found. Nothing to do."; exit 0; fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          find extracted -type d -name ".github" -prune -exec rm -rf {} +
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then cp -a "$ROOT"/. .; else cp -a extracted/. .; fi
          rm -rf extracted "$ZIP"
      - name: Apply final TMDB poster proxy
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.js')
          text = p.read_text()
          old = """function rewriteBetterPosterUrls(body) {\n    return body.replace(/https?:\\/\\/btttr\\.cc\\/[^\\\"'\\s<>]*?\\/((tt\\d+))\\.jpg(?:\\?[^\\\"'\\s<>]*)?/gi, (_, fullId, imdbId) => nativePosterUrl(imdbId))\n        .replace(/https?:\\/\\/btttr\\.cc\\/[^\\\"'\\s<>]*?((tt\\d+))\\.jpg(?:\\?[^\\\"'\\s<>]*)?/gi, (_, fullId, imdbId) => nativePosterUrl(imdbId));\n}\n"""
          new = """function rewriteBetterPosterUrls(body, publicBaseUrl) {\n    const root = String(publicBaseUrl || '').replace(/\\/$/, '');\n    return body\n        .replace(/https?:\\/\\/image\\.tmdb\\.org\\/t\\/p\\/(w\\d+|original)\\/([A-Za-z0-9._-]+\\.jpg)/gi, (_, size, file) => `${root}/tmdb-poster/${size}/${file}`)\n        .replace(/https?:\\/\\/btttr\\.cc\\/[^\\\"'\\s<>]*?\\/((tt\\d+))\\.jpg(?:\\?[^\\\"'\\s<>]*)?/gi, (_, fullId, imdbId) => nativePosterUrl(imdbId))\n        .replace(/https?:\\/\\/btttr\\.cc\\/[^\\\"'\\s<>]*?((tt\\d+))\\.jpg(?:\\?[^\\\"'\\s<>]*)?/gi, (_, fullId, imdbId) => nativePosterUrl(imdbId));\n}\n"""
          if old not in text:
              raise SystemExit('rewriteBetterPosterUrls block not found')
          text = text.replace(old, new)
          text = text.replace("!['manifest.json', 'catalog', 'meta', 'poster', 'configure', 'test-tmdb']", "!['manifest.json', 'catalog', 'meta', 'poster', 'tmdb-poster', 'configure', 'test-tmdb']")
          marker = """    const posterMatch = req.url.match(/^\\/poster\\/(tt\\d+)\\/(dub|sub|dub_sub)\\.svg$/i);\n    if (posterMatch) {\n        const target = frenchPosterUrl(posterMatch[1], posterMatch[2].toLowerCase());\n        res.writeHead(302, { Location: target, 'Cache-Control': 'public, max-age=3600', 'Access-Control-Allow-Origin': '*' });\n        return res.end();\n    }\n\n"""
          insert = marker + """    const tmdbPosterMatch = req.url.match(/^\\/tmdb-poster\\/(w\\d+|original)\\/([A-Za-z0-9._-]+\\.jpg)$/i);\n    if (tmdbPosterMatch) {\n        const target = `https://image.tmdb.org/t/p/${tmdbPosterMatch[1]}/${tmdbPosterMatch[2]}`;\n        fetch(target, { headers: { 'User-Agent': 'FrenchStreamEnhanced/0.1' } })\n            .then(async response => {\n                if (!response.ok) throw new Error(`TMDB image ${response.status}`);\n                const buffer = Buffer.from(await response.arrayBuffer());\n                res.writeHead(200, {\n                    'Content-Type': response.headers.get('content-type') || 'image/jpeg',\n                    'Content-Length': String(buffer.length),\n                    'Cache-Control': 'public, max-age=2592000, s-maxage=2592000',\n                    'Access-Control-Allow-Origin': '*'\n                });\n                res.end(buffer);\n            })\n            .catch(error => {\n                if (!res.headersSent) res.writeHead(502, { 'Content-Type': 'text/plain; charset=utf-8' });\n                res.end(`Poster proxy error: ${error?.message || 'TMDB image unavailable'}`);\n            });\n        return;\n    }\n\n"""
          if marker not in text:
              raise SystemExit('poster route marker not found')
          text = text.replace(marker, insert, 1)
          text = text.replace("const body = rewriteBetterPosterUrls(Buffer.concat(chunks).toString('utf8'));", "const body = rewriteBetterPosterUrls(Buffer.concat(chunks).toString('utf8'), publicBaseUrl);")
          p.write_text(text)
          print('server.js TMDB poster proxy installed')
      - name: Verify proxy implementation
        run: |
          grep -n "tmdb-poster" server.js
          grep -n "rewriteBetterPosterUrls(Buffer.concat(chunks)" server.js
          grep -n "poster = tmdb.poster || poster" addon.js
          grep -n "const poster = tmdb.poster || item.poster" src/worker.mjs
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; else git commit -m "fix: proxy TMDB posters through addon"; git push; fi
