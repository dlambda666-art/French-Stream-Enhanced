name: Extract French Stream project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair BetterPoster and lazy-loaded series posters
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'addon.js';
          let s = fs.readFileSync(file, 'utf8');

          const oldBp = `function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // No BetterPoster at all. Tagged items still use our French Poster SVG pipeline.
              if (!languageTag || languageTag === 'NONE') return null;
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return null;
              return \`${root}/poster/\${safeId}/\${languageTag.toLowerCase()}.svg\`;
          }`;

          const newBp = `function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // Restore BetterPoster for untagged items. Tagged items keep the French Poster badge pipeline.
              if (!languageTag || languageTag === 'NONE') return \`${BETTERPOSTER_BASE}\${safeId}.jpg\`;
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return \`${BETTERPOSTER_BASE}\${safeId}.jpg\`;
              return \`${root}/poster/\${safeId}/\${languageTag.toLowerCase()}.svg\`;
          }`;

          if (!s.includes(oldBp)) throw new Error('BetterPoster block not found');
          s = s.replace(oldBp, newBp);

          const oldPoster = `        const $img = $(el).find('img').first();
          let poster = $img.attr('src') || $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || '';
          if (!poster) {
              const srcset = $img.attr('srcset') || $img.attr('data-srcset') || '';
              poster = srcset.split(',')[0]?.trim().split(/\\s+/)[0] || '';
          }
          if (poster && !poster.startsWith('http')) poster = 'https://maj.french-stream.pink' + poster;`;

          const newPoster = `        const $img = $(el).find('img').first();
          // Series posters are often lazy-loaded: src can be a blank/placeholder.
          const posterCandidates = [
              $img.attr('data-src'),
              $img.attr('data-original'),
              $img.attr('data-lazy-src'),
              $img.attr('data-url'),
              $img.attr('data-poster'),
              $img.attr('data-image'),
              $img.attr('data-srcset'),
              $img.attr('srcset'),
              $img.attr('src')
          ].filter(Boolean);
          let poster = '';
          for (const candidate of posterCandidates) {
              const first = String(candidate).split(',')[0]?.trim().split(/\\s+/)[0] || '';
              if (!first || /^(data:image|about:blank)/i.test(first)) continue;
              if (/(?:^|[\\/_-])(blank|placeholder|spacer|transparent)(?:[._/-]|$)/i.test(first)) continue;
              poster = first;
              break;
          }
          if (poster.startsWith('//')) poster = 'https:' + poster;
          else if (poster && !/^https?:\\/\\//i.test(poster)) poster = 'https://maj.french-stream.pink' + (poster.startsWith('/') ? '' : '/') + poster;`;

          if (!s.includes(oldPoster)) throw new Error('Poster extraction block not found');
          s = s.replace(oldPoster, newPoster);

          fs.writeFileSync(file, s);
          console.log('Poster repair applied successfully.');
          NODE

      - name: Validate JavaScript
        run: node --check addon.js

      - name: Commit repaired addon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix: restore BetterPoster and prefer real lazy-loaded series posters"
            git push
          fi
