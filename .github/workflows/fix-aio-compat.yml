name: Fix AIO metadata compatibility

on:
  push:
    branches: [clean-selfhost-rebuild]

permissions:
  contents: write

jobs:
  fix-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Force exact BetterPoster configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          addon = Path('addon.js')
          s = addon.read_text()

          s, n = re.subn(
              r"const BETTERPOSTER_BASE\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const BETTERPOSTER_BASE = 'https://btttr.cc/poster-qa/imdb/poster-default/';",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('BETTERPOSTER_BASE not found exactly once')

          pattern = re.compile(r"function betterPosterUrl\(imdbId, languageTag, baseUrl = ''\) \{.*?\n\}", re.S)
          replacement = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              return `${BETTERPOSTER_BASE}${encodeURIComponent(imdbId)}.jpg?lang=fr`;
          }"""
          s, n = pattern.subn(lambda _m: replacement, s, count=1)
          if n != 1:
              raise SystemExit('betterPosterUrl function not found exactly once')

          # BetterPoster must be the primary catalog poster. TMDB is only the fallback.
          s, n = re.subn(
              r"poster = tmdb\.poster \|\| betterPosterUrl\(tmdb\.imdbId, item\.languageTag, config\.posterBaseUrl\) \|\| poster;",
              "poster = betterPosterUrl(tmdb.imdbId, item.languageTag, config.posterBaseUrl) || tmdb.poster || poster;",
              s,
          )
          if n < 1:
              raise SystemExit('TMDB-first poster assignment not found')

          addon.write_text(s)

          server = Path('server.js')
          s = server.read_text()
          pattern = re.compile(r"function rewriteBetterPosterUrls\(body\) \{.*?\n\}", re.S)
          replacement = """function rewriteBetterPosterUrls(body) {
              return body;
          }"""
          s, n = pattern.subn(lambda _m: replacement, s, count=1)
          if n != 1:
              raise SystemExit('rewriteBetterPosterUrls function not found exactly once')
          server.write_text(s)
          PY

          node --check addon.js
          node --check server.js
          grep -q 'https://btttr.cc/poster-qa/imdb/poster-default/' addon.js
          grep -q 'jpg?lang=fr' addon.js
          grep -q 'betterPosterUrl(tmdb.imdbId, item.languageTag, config.posterBaseUrl) || tmdb.poster || poster;' addon.js
          grep -q 'return body;' server.js

      - name: Commit BetterPoster fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addon.js server.js
          if git diff --cached --quiet; then
            echo 'BetterPoster configuration already correct.'
          else
            git commit -m 'Force BetterPoster before TMDB fallback [betterposter-fixed]'
            git push origin clean-selfhost-rebuild
          fi

      - name: Sync final tree to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Lambda666/Frankenstream
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
