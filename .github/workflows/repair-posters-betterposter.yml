name: Repair posters and restore BetterPoster

on:
  push:
    paths:
      - .github/workflows/repair-posters-betterposter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair addon.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text(encoding='utf-8')

          old = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // No BetterPoster at all. Tagged items still use our French Poster SVG pipeline.
              if (!languageTag || languageTag === 'NONE') return null;
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return null;
              return `${root}/poster/${safeId}/${languageTag.toLowerCase()}.svg`;
          }"""
          new = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {
              if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;
              const safeId = encodeURIComponent(imdbId);
              // Keep the original BetterPoster for untagged items.
              if (!languageTag || languageTag === 'NONE') return `${BETTERPOSTER_BASE}${safeId}.jpg`;
              // Tagged items use our French Poster SVG pipeline so the DUB/SUB badge is preserved.
              const root = String(baseUrl || '').replace(/\\/$/, '');
              if (!root) return `${BETTERPOSTER_BASE}${safeId}.jpg`;
              return `${root}/poster/${safeId}/${languageTag.toLowerCase()}.svg`;
          }"""
          if old not in s:
              raise SystemExit('betterPosterUrl block not found; refusing to modify addon.js')
          s = s.replace(old, new, 1)

          old_scraper = """          const $img = $(el).find('img').first();
              let poster = $img.attr('src') || $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || '';
              if (!poster) {
                  const srcset = $img.attr('srcset') || $img.attr('data-srcset') || '';
                  poster = srcset.split(',')[0]?.trim().split(/\\s+/)[0] || '';
              }
              if (poster && !poster.startsWith('http')) poster = 'https://maj.french-stream.pink' + poster;"""
          new_scraper = """          const $img = $(el).find('img').first();
              const posterCandidates = [
                  $img.attr('data-src'),
                  $img.attr('data-original'),
                  $img.attr('data-lazy-src'),
                  $img.attr('data-url'),
                  $img.attr('data-poster'),
                  $img.attr('data-image'),
                  $img.attr('data-srcset'),
                  $img.attr('srcset'),
                  $img.attr('src')
              ].filter(Boolean);
              let poster = '';
              for (const candidate of posterCandidates) {
                  const first = String(candidate).split(',')[0]?.trim().split(/\\s+/)[0] || '';
                  if (!first || /^(data:image|about:blank)/i.test(first)) continue;
                  if (/(?:^|[\\/_-])(blank|placeholder|spacer|transparent)(?:[._/-]|$)/i.test(first)) continue;
                  poster = first;
                  break;
              }
              if (poster.startsWith('//')) poster = 'https:' + poster;
              else if (poster && !/^https?:\\/\\//i.test(poster)) poster = 'https://maj.french-stream.pink' + (poster.startsWith('/') ? '' : '/') + poster;"""
          if old_scraper not in s:
              raise SystemExit('scrapeItems poster block not found; refusing to modify addon.js')
          s = s.replace(old_scraper, new_scraper, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check addon.js

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-posters-betterposter.yml
          git add addon.js
          git commit -m "fix: restore BetterPoster and lazy-loaded series posters"
          git push
