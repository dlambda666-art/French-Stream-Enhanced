name: Fix catalog cache and posters

on:
  push:
    branches: [clean-selfhost-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[cache-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply catalog cache, poster and logo fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('addon.js')
          text = path.read_text(encoding='utf-8')
          changed = False

          old_get = "    if (cache.has(cacheKey)) return cache.get(cacheKey);"
          new_get = "    const cached = cache.get(cacheKey);\n    if (cached && Date.now() - cached.cachedAt < CACHE_TTL) return cached.items;"
          old_set = "    cache.set(cacheKey, enriched);"
          new_set = "    cache.set(cacheKey, { items: enriched, cachedAt: Date.now() });"

          if old_get in text and old_set in text:
              text = text.replace(old_get, new_get, 1).replace(old_set, new_set, 1)
              changed = True

          old_better = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {\n    if (!imdbId || !/^tt\\d+$/i.test(imdbId)) return null;\n    const safeId = encodeURIComponent(imdbId);\n    // No BetterPoster at all. Tagged items still use our French Poster SVG pipeline.\n    if (!languageTag || languageTag === 'NONE') return null;\n    const root = String(baseUrl || '').replace(/\\/$/, '');\n    if (!root) return null;\n    return `${root}/poster/${safeId}/${languageTag.toLowerCase()}.svg`;\n}"""
          new_better = """function betterPosterUrl(imdbId, languageTag, baseUrl = '') {\n    // Disabled: an unavailable generated-poster endpoint caused blank cards in Stremio.\n    // Posters now come directly from TMDB, with the French Stream poster as fallback.\n    return null;\n}"""
          if old_better in text:
              text = text.replace(old_better, new_better, 1)
              changed = True

          old_poster = """        let poster = $(el).find('img').first().attr('src') || $(el).find('img').first().attr('data-src') || $(el).find('img').first().attr('data-original') || $(el).find('img').first().attr('data-lazy-src') || '';\n        if (poster.startsWith('//')) poster = 'https:' + poster;\n        else if (poster && !poster.startsWith('http')) poster = 'https://french-stream.pink' + poster;"""
          new_poster = """        const $img = $(el).find('img').first();\n        let poster = $img.attr('src') ||\n            $img.attr('data-src') ||\n            $img.attr('data-original') ||\n            $img.attr('data-lazy-src') ||\n            $img.attr('data-image') ||\n            $img.attr('data-lazy') ||\n            $img.attr('data-fallback-src') ||\n            '';\n        if (!poster) {\n            const srcset = $img.attr('srcset') || $img.attr('data-srcset') || '';\n            poster = srcset.split(',')[0].trim().split(/\\s+/)[0] || '';\n        }\n        if (!poster) {\n            const style = $img.attr('style') || '';\n            const match = style.match(/url\\([\\\"']?([^\\\"')]+)[\\\"']?\\)/i);\n            poster = match ? match[1] : '';\n        }\n        if (poster.startsWith('//')) poster = 'https:' + poster;\n        else if (poster && !poster.startsWith('http')) poster = 'https://french-stream.pink' + poster;"""
          if old_poster in text:
              text = text.replace(old_poster, new_poster, 1)
              changed = True

          old_search_poster = """        let poster = $item.find('img').first().attr('src') || '';"""
          new_search_poster = """        const $img = $item.find('img').first();\n        let poster = $img.attr('src') ||\n            $img.attr('data-src') ||\n            $img.attr('data-original') ||\n            $img.attr('data-lazy-src') ||\n            $img.attr('data-image') ||\n            $img.attr('data-lazy') ||\n            '';\n        if (!poster) {\n            const srcset = $img.attr('srcset') || $img.attr('data-srcset') || '';\n            poster = srcset.split(',')[0].trim().split(/\\s+/)[0] || '';\n        }"""
          if old_search_poster in text:
              text = text.replace(old_search_poster, new_search_poster, 1)
              changed = True

          old_logo = "https://french-stream.pink/templates/flavor/dleflavour/assets/images/x325_logo.png.pagespeed.ic.hpZlJOA7lE.webp"
          new_logo = "https://raw.githubusercontent.com/dlambda666-art/French-Stream-Enhanced/clean-selfhost-rebuild/file_000000005400820a9793431655245097.png"
          if old_logo in text:
              text = text.replace(old_logo, new_logo)
              changed = True

          path.write_text(text, encoding='utf-8')
          print('Poster/cache/logo patch prepared:', changed)

      - name: Validate JavaScript
        run: node --check addon.js

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- addon.js; then
            echo "No addon.js changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          git commit -m "Apply catalog cache, poster and logo fixes [cache-fixed]"
          git push
