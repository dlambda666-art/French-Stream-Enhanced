name: Fix lazy-loaded posters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: support lazy-loaded poster sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch poster extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          old = """        let poster = $img.attr('src') || $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || '';"""
          new = """        // French Stream uses lazy-loading on some posters: the real image can be in data-src/data-original while src is a placeholder.\n        let poster = $img.attr('data-src') || $img.attr('data-original') || $img.attr('data-lazy-src') || $img.attr('data-url') || $img.attr('src') || '';"""
          if old not in s:
              raise SystemExit('Expected poster extraction line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lazy-posters.yml
          git add addon.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: support lazy-loaded poster sources"
          git push
