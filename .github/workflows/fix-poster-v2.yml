name: Repair poster extraction

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch poster extraction
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          addon_old = """        let poster = $scope.find('img').first().attr('src') || $scope.find('img').first().attr('data-src') || $link.find('img').attr('src') || '';\n        if (poster && !poster.startsWith('http')) poster = 'https://maj.french-stream.pink' + poster;"""
          worker_old = """        let poster = $scope.find('img').first().attr('src') || $scope.find('img').first().attr('data-src') || $link.find('img').attr('src') || '';\n        if (poster && !poster.startsWith('http')) poster = FRENCH_STREAM_ORIGIN + poster;"""
          new = """        const $img = $scope.find('img').first().length ? $scope.find('img').first() : $link.find('img').first();\n        const posterAttrs = ['src', 'data-src', 'data-lazy-src', 'data-original', 'data-image', 'data-lazy', 'data-fallback', 'data-url', 'data-thumb'];\n        let poster = '';\n        for (const attr of posterAttrs) {\n            const value = $img.attr(attr);\n            if (value && !/^data:image\\//i.test(value)) {\n                poster = value.trim();\n                break;\n            }\n        }\n        if (poster && poster.startsWith('//')) poster = 'https:' + poster;\n        else if (poster && !/^https?:\\/\\//i.test(poster)) {\n            poster = FRENCH_STREAM_ORIGIN + (poster.startsWith('/') ? poster : '/' + poster);\n        }"""

          addon = Path('addon.js')
          worker = Path('src/worker.mjs')
          a = addon.read_text()
          w = worker.read_text()
          if addon_old not in a:
              raise SystemExit('Expected addon poster block not found')
          if worker_old not in w:
              raise SystemExit('Expected worker poster block not found')
          addon.write_text(a.replace(addon_old, new, 1))
          worker.write_text(w.replace(worker_old, new, 1))
          print('Both poster extraction blocks patched')
          PY

      - name: Verify files
        run: |
          grep -q "data-lazy-src" addon.js
          grep -q "data-lazy-src" src/worker.mjs
          grep -q "module.exports" addon.js
          grep -q "function scrapeItems" src/worker.mjs
          echo "Poster extraction patch verified"

      - name: Commit repair and remove one-shot workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js src/worker.mjs
          git rm .github/workflows/fix-poster-v2.yml
          git rm -f POSTER_REPAIR_TRIGGER.txt || true
          git commit -m "fix: robust lazy poster extraction"
          git push
