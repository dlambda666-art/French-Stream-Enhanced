name: Fix Worker French Stream domain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old domain in remaining worker/test files
        run: |
          set -e
          grep -rl --exclude-dir=.git 'https://french-stream.pink' src tests | xargs -r sed -i 's#https://french-stream\\.pink#https://maj.french-stream.pink#g'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/fix-worker-domain.yml
          git rm -f .github/workflows/fix-worker-domain.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align worker and tests with maj domain'
          git push
